<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume &amp; Cover Letter Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root {
    --ink: #1c2430;
    --ink-soft: #4b5563;
    --paper: #f6f5f2;
    --panel: #ffffff;
    --line: #dfdcd4;
    --accent: #1f4e79;
    --accent-soft: #e8eef4;
    --ok: #1e7d4a;
    --ok-bg: #eaf6ef;
    --err: #b3261e;
    --err-bg: #fbebea;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  header.page-head {
    margin-bottom: 32px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
  }

  header.page-head .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 6px;
  }

  header.page-head h1 {
    font-size: 30px;
    margin: 0;
    font-weight: 700;
  }

  header.page-head p {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink-soft);
    font-size: 14px;
    margin: 10px 0 0;
  }

  form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .field input[type="text"],
  .field input[type="number"],
  .field select,
  .field input[type="file"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
  }

  .field input:focus,
  .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
  }

  @media (max-width: 560px) {
    .row-2, .row-3 { grid-template-columns: 1fr; }
  }

  button.submit {
    width: 100%;
    padding: 14px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    margin-top: 6px;
  }

  button.submit:hover { background: #17395c; }
  button.submit:disabled { background: #9fb3c4; cursor: not-allowed; }

  #status {
    margin-top: 28px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  #status h2 {
    font-family: 'Georgia', serif;
    font-size: 20px;
    margin: 0 0 16px;
  }

  .status-msg {
    font-size: 14px;
    color: var(--ink-soft);
  }

  .job-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
    background: var(--panel);
  }

  .job-card h3 {
    margin: 0 0 12px;
    font-size: 17px;
    font-family: 'Georgia', serif;
  }

  .job-card .doc-line {
    font-size: 14px;
    margin: 6px 0;
  }

  .job-card .doc-line strong {
    display: inline-block;
    min-width: 96px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .job-card a {
    color: var(--accent);
    text-decoration: underline;
  }

  .generate-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 16px;
    background: var(--ok);
    color: #fff;
    border: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }

  .generate-btn:hover { background: #17603a; }
  .generate-btn:disabled { background: #9fb3c4; cursor: not-allowed; }

  .result-block {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .doc-link {
    padding: 8px 14px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--accent);
  }

  .doc-link:hover { background: var(--accent-soft); }

  .apply-btn {
    padding: 8px 16px;
    background: #FFF;
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 6px;
  }

  .apply-btn:hover { background: #ddf4e8; }

  .not-available {
    color: #9aa0a6;
    font-style: italic;
  }

  .error-box {
    background: var(--err-bg);
    border: 1px solid var(--err);
    color: var(--err);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14px;
  }

  .error-inline {
    color: var(--err);
    font-size: 13px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <p class="eyebrow">Job Application Assistant</p>
      <h1>Resume &amp; Cover Letter Generator</h1>
      <p>Upload your resume, tell us what you're looking for, and we'll tailor an application for each matching role.</p>
    </header>

    <form onsubmit="event.preventDefault(); searchJobs();">
      <div class="field">
        <label for="resumeFile">Resume (.docx)</label>
        <input type="file" id="resumeFile" accept=".docx" required />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="jobTitle">Job title</label>
          <input type="text" id="jobTitle" placeholder="e.g. Java Fullstack Developer" required />
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input type="text" id="location" placeholder="e.g. Minnesota, USA" required />
        </div>
      </div>

      <div class="row-3">
        <div class="field">
          <label for="NoOfJobs">Number of jobs</label>
          <input type="number" id="NoOfJobs" min="1" max="20" value="5" required />
        </div>
        <div class="field">
          <label for="jobSource">Job source</label>
          <select id="jobSource">
            <option value="linkedin">LinkedIn</option>
            <option value="indeed">Indeed</option>
          </select>
        </div>
        <div class="field">
          <label for="jobType">Job type</label>
          <select id="jobType">
            <option value="FULLTIME">Full-time</option>
            <option value="INTERNSHIP">INTERNSHIP</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="workPlace">Workplace</label>
        <select id="workPlace">
          <option value="HYBRID">HYBRID</option>
          <option value="REMOTE">REMOTE</option>
        </select>
      </div>

      <button type="submit" class="submit" id="submitBtn">Generate applications</button>
    </form>

    <div id="status"></div>
  </div>

<script>
async function extractResumeText() {
  const resumeFile = document.getElementById("resumeFile").files[0];
  if (!resumeFile) {
    throw new Error("Please upload a DOCX resume.");
  }
  const arrayBuffer = await resumeFile.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  return result.value;
}

// Pulls a value from an object trying several possible key names,
// since your Google Sheet columns / n8n nodes may use different casing/naming.
function pick(obj, keys) {
  for (const k of keys) {
    if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") {
      return obj[k];
    }
  }
  return null;
}

// Normalizes one job object coming back from the searchJobs webhook
// (response shape: { "companies": [ {...}, {...} ] }) into a consistent
// shape for rendering. The FULL original object is kept under `raw` so
// it can be sent on to the generateResume workflow untouched.
function normalizeJob(row) {
  return {
    jobId: pick(row, ["job_id", "jobId"]) || "",
    jobUrl: pick(row, ["job_url", "jobUrl", "Job Post Link"]) || "#",
    title: pick(row, ["job_title", "Job Title", "jobTitle", "title"]) || "Untitled Role",
    company: pick(row, ["company_name", "Company Name", "companyName", "company"]) || "Unknown Company",
    companyUrl: pick(row, ["company_url", "Company Website", "companyWebsite"]) || "",
    location: pick(row, ["location", "Location"]) || "",
    seniority: pick(row, ["seniority_level", "Seniority Level", "seniority"]) || "",
    employmentType: pick(row, ["employment_type", "employmentType"]) || "",
    postedAt: pick(row, ["time_posted", "Posted At", "postedAt"]) || "",
    applicants: pick(row, ["num_applicants", "Applicants", "applicants"]) || "",
    salary: pick(row, ["salary_range", "Salary", "salary"]) || "",
    description: pick(row, ["job_description", "Description", "description"]) || "",
    easyApply: pick(row, ["easy_apply", "easyApply"]),
    applyLink: pick(row, ["job_url", "Application Link", "applyLink"]) || "#",
    raw: row // <-- entire original job object, untouched
  };
}

function renderJobs(jobs) {
  const status = document.getElementById("status");

  if (!jobs.length) {
    status.innerHTML = `<p class="status-msg">No jobs found. Try widening your search.</p>`;
    return;
  }

  let html = "<h2>Jobs Found</h2>";
  jobs.forEach((job, index) => {
    html += `
      <div class="job-card">
        <h3>${job.company} | ${job.location} | ${job.title}</h3>
        <div id="action-${index}">
          <button class="generate-btn" id="btn-${index}" onclick="generateResume(${index})">
            Generate Resume
          </button>
        </div>
      </div>
    `;
  });

  status.innerHTML = html;
  window.jobs = jobs;
}

async function generateResume(index) {
  const job = window.jobs[index];
  const actionEl = document.getElementById(`action-${index}`);
  const button = document.getElementById(`btn-${index}`);

  button.disabled = true;
  button.innerHTML = "Generating...";

  try {
    // Send the FULL sheet row for this company, exact column names,
    // straight to the generateResume workflow as JSON.
    const response = await fetch(
      "https://mercury6.app.n8n.cloud/webhook/generateResume",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(job.raw)
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText || `Request failed with status ${response.status}`);
    }

   const responseData = await response.json();

// n8n returns an array
const result = Array.isArray(responseData)
    ? responseData[0]
    : responseData;

const resumeUrl = result.resumeUrl;
const coverLetterUrl = result.coverLetterUrl;
const applyLink = result.ApplyLink || job.applyLink;
const companyName = result.companyName || job.company;
const location=result.location||job.location;
const role=result.title||job.title

actionEl.innerHTML = `
<div class="result-block">

    <strong>${companyName} ${location}  ${role}</strong><br><br>

    ${
        resumeUrl
            ? `<a class="doc-link" href="${resumeUrl}" target="_blank">
                Resume
               </a>`
            : ""
    }

    ${
        coverLetterUrl
            ? `<a class="doc-link" href="${coverLetterUrl}" target="_blank">
                Cover Letter
               </a>`
            : ""
    }

    ${
        applyLink
            ? `<a class="apply-btn" href="${applyLink}" target="_blank">
                Apply Now
               </a>`
            : ""
    }

</div>
`;
  } catch (error) {
    actionEl.innerHTML = `
      <div class="error-inline">Error: ${error.message}</div>
      <button class="generate-btn" id="btn-${index}" onclick="generateResume(${index})">Retry</button>
    `;
    console.error(error);
  }
}

async function searchJobs() {
  const status = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  submitBtn.disabled = true;
  status.innerHTML = `<p class="status-msg">Extracting resume...</p>`;

  try {
    const resumeContent = await extractResumeText();
    const resumeFile = document.getElementById("resumeFile").files[0];

    status.innerHTML = `<p class="status-msg">Searching jobs and generating tailored applications...</p>`;

    const formData = new FormData();
    formData.append("resume", resumeFile);
    formData.append("jobTitle", document.getElementById("jobTitle").value);
    formData.append("location", document.getElementById("location").value);
    formData.append("NoOfJobs", document.getElementById("NoOfJobs").value);
    formData.append("jobSource", document.getElementById("jobSource").value);
    formData.append("jobType", document.getElementById("jobType").value);
    formData.append("workPlace", document.getElementById("workPlace").value);
    formData.append("resumeContent", resumeContent);

    // Raw rows from your sheet, flattened into one array: [{},{},{},{}]
    const rawResults = [];

    // for (let i = 1; i <= 2; i++) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1000000);

      const response = await fetch(
        "https://mercury6.app.n8n.cloud/webhook/searchJobs",
        {
          method: "POST",
          body: formData,
          signal: controller.signal
        }
      );
      clearTimeout(timeoutId);

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || `Request failed with status ${response.status}`);
      }

      const result = await response.json();

      // Response shape from n8n: { "companies": [ {...}, {...} ] }
      // (n8n may also wrap the whole thing in [{ json: {...} }] depending
      // on how the Webhook node responds — handle both.)
      let payload = result;
      if (Array.isArray(payload) && payload.length && payload[0] && "json" in payload[0]) {
        payload = payload[0].json;
      }

      const companies = Array.isArray(payload)
        ? payload
        : (payload && Array.isArray(payload.companies) ? payload.companies : [payload]);

      companies.forEach(row => rawResults.push(row));
    //}

    // Normalize every row (extracts + keeps ALL sheet data per job)
    const jobs = rawResults.map(normalizeJob);

    renderJobs(jobs);

  } catch (error) {
    status.innerHTML = `
      <div class="error-box">
        <strong>Error:</strong><br>${error.message}
      </div>
    `;
    console.error(error);
  } finally {
    submitBtn.disabled = false;
  }
}
</script>
</body>
</html>
