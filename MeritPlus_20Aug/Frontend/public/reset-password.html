<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Resume &amp; Cover Letter Generator</title>
<link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <p class="eyebrow">Job Application Assistant</p>
    <h1>Reset Password</h1>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" />
        <p class="hint">At least 8 characters.</p>
      </div>
      <button type="submit" class="submit" id="submitBtn">Reset Password</button>
      <div id="formMsg" class="form-msg"></div>
    </form>

    <p class="switch"><a href="/login.html">Back to login</a></p>
  </div>

<script>
  const token = new URLSearchParams(window.location.search).get("token");

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");
    submitBtn.disabled = true;
    msg.className = "form-msg";

    if (!token) {
      msg.textContent = "This reset link is missing a token. Request a new one.";
      msg.classList.add("error");
      submitBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword: document.getElementById("newPassword").value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Something went wrong");

      msg.textContent = data.message + " Redirecting to login…";
      msg.classList.add("success");
      setTimeout(() => (window.location.href = "/login.html"), 1500);
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add("error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
