<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — Resume &amp; Cover Letter Generator</title>
<link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <p class="eyebrow">Job Application Assistant</p>
    <h1>Create Account</h1>

    <form id="registerForm">
      <div class="row-2">
        <div class="field">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" required />
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" required />
        </div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        <p class="hint">At least 8 characters.</p>
      </div>
      <button type="submit" class="submit" id="submitBtn">Register</button>
      <div id="formMsg" class="form-msg"></div>
    </form>

    <p class="switch">Already have an account? <a href="/login.html">Log in</a></p>
  </div>

<script src="/js/auth-client.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");
    submitBtn.disabled = true;
    msg.textContent = "";
    msg.className = "form-msg";

    try {
      const res = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          firstName: document.getElementById("firstName").value,
          lastName: document.getElementById("lastName").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Registration failed");

      setSession(data.token, data.user);
      window.location.href = "/index.html";
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add("error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
