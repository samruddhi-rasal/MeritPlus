        "https://sammruddhi.app.n8n.cloud/webhook/resume",
        {
          method: "POST",
          body: formData,
          signal: controller.signal
        }
      );
      clearTimeout(timeoutId);

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || `Request failed with status ${response.status}`);
      }

      const result = await response.json();

      // Debug: inspect the raw n8n response shape while wiring up the backend.
      console.log("Raw n8n response:", result);

      // `result` can come back as:
      //   - a single job object: {...}
      //   - a flat array of job objects: [{...}, {...}]
      //   - an n8n-style array where each item wraps the real data
      //     in a `json` key: [{ json: {...} }, { json: {...} }]
      // In every case we push individual job objects into `results`,
      // never the whole per-request array, so results stays flat:
      // [{}, {}, {}, {}] instead of [[{},{}], [{},{}]].
      if (Array.isArray(result)) {
        result.forEach(item => {
          const job = item && typeof item === "object" && "json" in item ? item.json : item;
          results.push(job);
        });
      } else {
        results.push(result);
      }
    }

    renderResults(results);

  } catch (error) {
    status.innerHTML = `
      <div class="error-box">
        <strong>Error:</strong><br>${error.message}
      </div>
    `;
    console.error(error);
  } finally {
    submitBtn.disabled = false;
  }
}
</script>
</body>
</html>
