<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — Resume &amp; Cover Letter Generator</title>
<link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrap">
    <p class="eyebrow">Job Application Assistant</p>
    <h1>Forgot Password</h1>
    <p class="lede">Enter your email and we'll generate a password reset link for you.</p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <button type="submit" class="submit" id="submitBtn">Send Reset Link</button>
      <div id="formMsg" class="form-msg"></div>
    </form>

    <p class="switch"><a href="/login.html">Back to login</a></p>
  </div>

<script>
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");
    submitBtn.disabled = true;
    msg.className = "form-msg";

    try {
      const res = await fetch("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Something went wrong");

      msg.innerHTML = `Reset link ready: <a href="${data.resetUrl}">${data.resetUrl}</a>`;
      msg.classList.add("success");
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add("error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
